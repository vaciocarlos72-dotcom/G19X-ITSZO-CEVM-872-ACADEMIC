services:
  db:
    image: postgres:15
    container_name: plurione_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: plurione_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: plurione_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the root .env file}@db:5432/plurione_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: plurione_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"

volumes:
  postgres_data:
